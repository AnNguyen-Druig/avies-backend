spring:
  application:
    name: avies-backend

  datasource:
    # URL ket noi JDBC toi Supabase Postgres voi schema aives
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require&currentSchema=aives}
    username: ${DB_USERNAME:postgres.zgdllubbmtqvzfsmezpg}
    password: ${DB_PASSWORD:Aives-Supabase-2026-Db}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: aives
        format_sql: true
    show-sql: true

# JWT Configuration (Secret Key 64+ bytes cho thuat toan HS512)
jwt:
  signerKey: ${JWT_SIGNER_KEY:56235e27daf8f8e68ce33febf5400cf93dbd5f6ec40a14531754168ea0d324869876543210abcdef0123456789abcdef}
  valid-duration: ${JWT_VALID_DURATION:3600}          # 1 gio (tinh bang giay)
  refreshable-duration: ${JWT_REFRESH_DURATION:604800} # 7 ngay (tinh bang giay)

# CORS Configuration
app:
  cors:
    allowed-origin-patterns:
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "http://localhost:8080"
      - "*"
