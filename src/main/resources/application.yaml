spring:
  config:
    import: "optional:file:./.env[.properties]"

  application:
    name: avies-backend

  # Kích thước file upload
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    # URL ket noi JDBC toi Supabase Postgres voi schema aives va public (chua extension pgvector)
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    # Cấu hình maximum connection cho Backend
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:2}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      idle-timeout: 60000
      connection-timeout: 30000
      data-source-properties:
        ApplicationName: ${DB_APPLICATION_NAME:aives-backend-local}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: aives
        format_sql: true
    show-sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Tắt kiểm tra sức khỏe Mail trong Actuator để tránh lỗi khi chưa cấu hình mật khẩu SMTP
management:
  health:
    mail:
      enabled: false

# OpenAI Configuration for RAG & Embeddings
openai:
  api-key: ${OPENAI_API_KEY}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  chat-model: ${OPENAI_CHAT_MODEL:gpt-4o}

# Gemini Configuration (tùy chọn hoặc dự phòng)
gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-3.8-flash}

# Storage Configuration
storage:
  location: ${STORAGE_LOCATION:uploads/materials}

# JWT Configuration (Secret Key 64+ bytes cho thuat toan HS512)
jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: ${JWT_VALID_DURATION:900}          # 15 phut (tinh bang giay)
  refreshable-duration: ${JWT_REFRESH_DURATION:604800} # 7 ngay (tinh bang giay)

# CORS Configuration
app:
  cors:
    allowed-origin-patterns:
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "http://localhost:8080"
      - "*"